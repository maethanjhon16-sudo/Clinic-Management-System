services:
  - type: web
    name: clinic-student-service
    runtime: python
    rootDir: services/student
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false

  - type: web
    name: clinic-appointments-service
    runtime: python
    rootDir: services/appointments
